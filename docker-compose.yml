services:
  db:
    image: postgres:15-alpine
    container_name: fastapi_library_db
    profiles: ["main"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 5

  test_db:
    container_name: fastapi_library_test_db
    image: postgres:15-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_test
    ports:
    - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d library_test" ]
      interval: 2s
      timeout: 3s
      retries: 5

  pytest:
    build: .
    container_name: fastapi_library_pytest
    profiles: ["test"]
    volumes:
      - .:/workspace
    command: pytest
    env_file:
      - .env
    environment:
      - DB_NAME=library_test
      - DB_PORT=5433
    depends_on:
      test_db:
        condition: service_healthy



  redis:
    image: redis:7-alpine
    container_name: fastapi_library_redis
    profiles: ["main"]
    ports:
    - "6379:6379"
    volumes:
    - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: fastapi_library_app
    profiles: ["main"]
    ports:
    - "8000:8000"
    volumes:
    - .:/workspace
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:


